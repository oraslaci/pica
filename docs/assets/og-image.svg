<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg-glow" cx="20%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1e2d" />
      <stop offset="50%" stop-color="#0f1016" />
      <stop offset="100%" stop-color="#08090d" />
    </radialGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-glow)" />

  <!-- Ambient Color Accents -->
  <circle cx="220" cy="315" r="180" fill="#3b82f6" opacity="0.12" filter="url(#soft-glow)" />
  <circle cx="950" cy="180" r="160" fill="#ef4444" opacity="0.08" filter="url(#soft-glow)" />
  <circle cx="1020" cy="460" r="150" fill="#10b981" opacity="0.08" filter="url(#soft-glow)" />

  <!-- Grid lines subtle decoration -->
  <path d="M 0 100 L 1200 100 M 0 200 L 1200 200 M 0 300 L 1200 300 M 0 400 L 1200 400 M 0 500 L 1200 500" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
  <path d="M 200 0 L 200 630 M 400 0 L 400 630 M 600 0 L 600 630 M 800 0 L 800 630 M 1000 0 L 1000 630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />

  <!-- Logo Group -->
  <g transform="translate(100, 205)">
    <!-- 6-Petal Shutter Icon -->
    <g transform="scale(2.2)">
      <circle cx="50" cy="50" r="48" fill="#1e293b" />
      <path d="M50 10 A40 40 0 0 1 90 50 L50 50 Z" fill="#ef4444" />
      <path d="M90 50 A40 40 0 0 1 78 84 L50 50 Z" fill="#f97316" />
      <path d="M78 84 A40 40 0 0 1 32 87 L50 50 Z" fill="#eab308" />
      <path d="M32 87 A40 40 0 0 1 12 59 L50 50 Z" fill="#22c55e" />
      <path d="M12 59 A40 40 0 0 1 25 21 L50 50 Z" fill="#3b82f6" />
      <path d="M25 21 A40 40 0 0 1 50 10 L50 50 Z" fill="#a855f7" />
      <circle cx="50" cy="50" r="18" fill="#0f172a" />
      <circle cx="50" cy="50" r="14" fill="#38bdf8" opacity="0.8" />
    </g>
  </g>

  <!-- Title & Copy -->
  <text x="360" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="76" fill="#ffffff" letter-spacing="-1">Pica</text>
  <text x="540" y="235" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" fill="#38bdf8" letter-spacing="1">PHOTO MANAGER</text>

  <text x="360" y="305" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="34" fill="#f1f5f9">
    Fast, Free &amp; 100% Offline Desktop Photo Organizer
  </text>
  <text x="360" y="350" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="24" fill="#94a3b8">
    The modern Google Picasa alternative for Windows, Mac &amp; Linux
  </text>

  <!-- Feature Pills -->
  <g transform="translate(360, 400)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="42" rx="21" fill="#1e2230" stroke="#333b50" stroke-width="1.5" />
    <circle cx="22" cy="21" r="6" fill="#10b981" />
    <text x="38" y="27" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">100% Offline</text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="200" height="42" rx="21" fill="#1e2230" stroke="#333b50" stroke-width="1.5" />
    <circle cx="217" cy="21" r="6" fill="#3b82f6" />
    <text x="233" y="27" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">No Subscriptions</text>

    <!-- Pill 3 -->
    <rect x="410" y="0" width="190" height="42" rx="21" fill="#1e2230" stroke="#333b50" stroke-width="1.5" />
    <circle cx="432" cy="21" r="6" fill="#f59e0b" />
    <text x="448" y="27" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Zero AI Bloat</text>

    <!-- Pill 4 -->
    <rect x="615" y="0" width="150" height="42" rx="21" fill="#1e2230" stroke="#333b50" stroke-width="1.5" />
    <circle cx="637" cy="21" r="6" fill="#ec4899" />
    <text x="653" y="27" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">120 FPS Grid</text>
  </g>

  <!-- Bottom Bar Info -->
  <g transform="translate(100, 560)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#64748b">
      https://oraslaci.github.io/pica
    </text>
    <text x="1000" y="0" text-anchor="end" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#64748b">
      Zero Cloud • Zero AI Chatbots • 100% Private
    </text>
  </g>
</svg>
