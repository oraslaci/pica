[package]
name = "app"
version = "0.2.0"
description = "Pica - Offline-first photo manager and non-destructive editor inspired by Google Picasa"
authors = ["Pica Contributors"]
license-file = "../LICENSE"
repository = "https://github.com/oraslaci/pica"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1.10"
walkdir = "2.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.5"
dirs = "5.0"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
percent-encoding = "2.3"
tiny_http = "0.12"
fast_image_resize = { version = "5.1", features = ["image", "rayon"] }
ort = { version = "2.0.0-rc.13" }
base64 = "0.22"
picasa_face = { path = "../picasa_face" }
yunet_face = { path = "../yunet_face" }

[dev-dependencies]
tempfile = "3.10"

[profile.dev.package."*"]
opt-level = 3

