<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Outer Housing / Lens Barrel Gradient -->
    <linearGradient id="housing-grad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#384358" />
      <stop offset="50%" stop-color="#242C3D" />
      <stop offset="100%" stop-color="#111622" />
    </linearGradient>

    <!-- Bezel Inner Stepped Ring -->
    <linearGradient id="step-ring-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A202C" />
      <stop offset="100%" stop-color="#0F131C" />
    </linearGradient>

    <!-- Center Aperture Core Housing -->
    <radialGradient id="aperture-core" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E2536" />
      <stop offset="70%" stop-color="#0F1420" />
      <stop offset="100%" stop-color="#070A10" />
    </radialGradient>

    <!-- Multi-Coated Camera Lens Optical Glass Gradient -->
    <radialGradient id="optical-glass" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#60CDFF" />
      <stop offset="35%" stop-color="#0284C7" />
      <stop offset="75%" stop-color="#034B7D" />
      <stop offset="100%" stop-color="#021E36" />
    </radialGradient>

    <!-- Specular Crescent Flare on Lens -->
    <linearGradient id="lens-specular" x1="0.2" y1="0" x2="0.8" y2="0.8">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#BAE6FD" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.0" />
    </linearGradient>

    <!-- Secondary Flare / Internal Reflection -->
    <radialGradient id="secondary-flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0" />
    </radialGradient>
    <linearGradient id="blade_grad_0" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="100%" stop-color="#E02424" />
    </linearGradient>
    <linearGradient id="blade_grad_1" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="blade_grad_2" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFCA28" />
      <stop offset="100%" stop-color="#F57F17" />
    </linearGradient>
    <linearGradient id="blade_grad_3" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#2ECC71" />
      <stop offset="100%" stop-color="#1E8E47" />
    </linearGradient>
    <linearGradient id="blade_grad_4" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#389BFF" />
      <stop offset="100%" stop-color="#1A6EDB" />
    </linearGradient>
    <linearGradient id="blade_grad_5" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
  </defs>

  <!-- 1. Outer Dark Lens Housing Chassis -->
  <circle cx="512.0" cy="512.0" r="440" fill="url(#housing-grad)" stroke="#4A5568" stroke-width="4" />
  
  <!-- Outer Knurled Edge / Highlight Ring -->
  <circle cx="512.0" cy="512.0" r="434" fill="none" stroke="#161B26" stroke-width="6" />
  <circle cx="512.0" cy="512.0" r="422" fill="url(#step-ring-grad)" stroke="#090D14" stroke-width="4" />

  <!-- Outer Bezel Top Highlight (Simulates 3D curved lighting) -->
  <path d="M 92.0 472.0 A 440 440 0 0 1 932.0 472.0" 
        fill="none" stroke="#FFFFFF" stroke-width="3.5" opacity="0.35" stroke-linecap="round" />

  <!-- 2. The 6 Iconic Colorful Shutter Petals -->
  <g stroke="#0E121B" stroke-width="7" stroke-linejoin="round">
    <path d="M 512.00 352.00 L 512.00 102.00 A 410 410 0 0 1 867.07 307.00 L 650.56 432.00 A 160 160 0 0 0 512.00 352.00 Z" fill="url(#blade_grad_0)" />
    <path d="M 650.56 432.00 L 867.07 307.00 A 410 410 0 0 1 867.07 717.00 L 650.56 592.00 A 160 160 0 0 0 650.56 432.00 Z" fill="url(#blade_grad_1)" />
    <path d="M 650.56 592.00 L 867.07 717.00 A 410 410 0 0 1 512.00 922.00 L 512.00 672.00 A 160 160 0 0 0 650.56 592.00 Z" fill="url(#blade_grad_2)" />
    <path d="M 512.00 672.00 L 512.00 922.00 A 410 410 0 0 1 156.93 717.00 L 373.44 592.00 A 160 160 0 0 0 512.00 672.00 Z" fill="url(#blade_grad_3)" />
    <path d="M 373.44 592.00 L 156.93 717.00 A 410 410 0 0 1 156.93 307.00 L 373.44 432.00 A 160 160 0 0 0 373.44 592.00 Z" fill="url(#blade_grad_4)" />
    <path d="M 373.44 432.00 L 156.93 307.00 A 410 410 0 0 1 512.00 102.00 L 512.00 352.00 A 160 160 0 0 0 373.44 432.00 Z" fill="url(#blade_grad_5)" />
  </g>

  <!-- Subtle inner edge shadow over the petals for depth -->
  <circle cx="512.0" cy="512.0" r="410" fill="none" stroke="#000000" stroke-width="5" opacity="0.4" />

  <!-- 3. Central Camera Aperture Core Barrel -->
  <circle cx="512.0" cy="512.0" r="180" fill="url(#aperture-core)" stroke="#0B0F17" stroke-width="8" />
  
  <!-- Inner Metallic Bezel Ring -->
  <circle cx="512.0" cy="512.0" r="168" fill="none" stroke="#2D3748" stroke-width="3" opacity="0.8" />
  <circle cx="512.0" cy="512.0" r="162" fill="none" stroke="#090D14" stroke-width="3" />

  <!-- 4. Deep Multi-Coated Optical Lens Glass -->
  <circle cx="512.0" cy="512.0" r="145" fill="url(#optical-glass)" />

  <!-- 5. Camera Lens Specular Highlights (Physical curved lens reflection) -->
  <!-- Primary Top-Left Specular Crescent -->
  <path d="M 417.0 482.0 
           Q 487.0 407.0 582.0 437.0 
           Q 502.0 452.0 417.0 482.0 Z" 
        fill="url(#lens-specular)" />

  <!-- Secondary Counter-Reflection (Bottom-Right Glint) -->
  <circle cx="572.0" cy="567.0" r="22" fill="url(#secondary-flare)" />
  <circle cx="564.0" cy="560.0" r="8" fill="#FFFFFF" opacity="0.6" />
</svg>