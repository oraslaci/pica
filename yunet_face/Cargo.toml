[package]
name = "yunet_face"
version = "0.2.1"
edition = "2021"
license-file = "../LICENSE"
description = "Clean Rust implementation of YuNet face detection (ONNX), unified 5-point facial alignment, and exemplar-stamped Sow-Grow clustering."

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ort = "=2.0.0-rc.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
picasa_face = { path = "../picasa_face" }
